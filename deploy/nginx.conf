# Merge into BaoTa's HTTPS server block for duanap.cn.
# Keep BaoTa's TLS certificate and ACME challenge configuration.
# Remove conflicting location / and regex locations that serve local static files.
client_max_body_size 12m;

location ~ /\.(?!well-known/) {
    deny all;
}

location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host duanap.cn;
    proxy_set_header X-Forwarded-Host duanap.cn;
    proxy_set_header X-Forwarded-Proto https;
    # Do not accept caller-supplied X-Real-IP. See deployment.md for EdgeOne.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

# Hashed public assets only. Media is handled by location / with no cache.
location ^~ /_astro/ {
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host duanap.cn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
